services:
  # Backend API Service
  - type: web
    name: sellerrocket-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/leads.db
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: FRONTEND_URL
        # Comma-separated list of allowed CORS origins.
        # Add any additional allowed origins separated by commas (no spaces).
        value: https://sellerrocket-venkateswaran.vercel.app,https://www.sellerrocket-venkateswaran.vercel.app
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
