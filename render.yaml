services:
  - type: web
    name: landing-page-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/leads.db
      - key: FRONTEND_URL
        sync: false
